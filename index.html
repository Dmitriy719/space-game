<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetherbound - Voxel Survival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        canvas {
            display: block;
            cursor: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 100;
        }

            #crosshair::before, #crosshair::after {
                content: '';
                position: absolute;
                background: white;
            }

            #crosshair::before {
                width: 2px;
                height: 24px;
                left: 11px;
                top: 0;
            }

            #crosshair::after {
                width: 24px;
                height: 2px;
                top: 11px;
                left: 0;
            }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 100;
        }

        .hotbar-slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            position: relative;
        }

            .hotbar-slot.active {
                border-color: #fff;
                background: rgba(255,255,255,0.2);
            }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 10px;
            z-index: 200;
            text-align: center;
            cursor: pointer;
        }

            #instructions h1 {
                margin-bottom: 20px;
                color: #00ffcc;
            }

            #instructions p {
                margin: 10px 0;
            }
    </style>
</head>
<body>
    <div id="instructions">
        <h1>🎮 AETHERBOUND</h1>
        <p><b>Кликните чтобы начать</b></p>
        <p>WASD - движение | Пробел - прыжок</p>
        <p>Shift - бег | ЛКМ - ломать | ПКМ - ставить</p>
        <p>1-5 - выбор блока | F - полёт/ходьба</p>
        <p>ESC - меню</p>
    </div>

    <div id="ui">
        <div>🎯 РЕЖИМ: <span id="mode">ХОДЬБА</span></div>
        <div>📍 ПОЗИЦИЯ: <span id="position">0, 0, 0</span></div>
        <div>⚡ FPS: <span id="fps">0</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="hotbar">
        <div class="hotbar-slot active" data-slot="0">🟫</div>
        <div class="hotbar-slot" data-slot="1">🟩</div>
        <div class="hotbar-slot" data-slot="2">⬜</div>
        <div class="hotbar-slot" data-slot="3"></div>
        <div class="hotbar-slot" data-slot="4">🟨</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ШУМ ПЕРЛИНА
        class SimplexNoise {
            constructor(seed = 42) {
                this.p = new Uint8Array(512);
                const perm = new Uint8Array(256);
                for (let i = 0; i < 256; i++) perm[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.abs(Math.sin(seed + i) * 10000) % (i + 1));
                    [perm[i], perm[j]] = [perm[j], perm[i]];
                }
                for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise3D(x, y, z) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = this.fade(x), v = this.fade(y), w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z;
                const B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z),
                    this.grad(this.p[BA], x - 1, y, z)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1),
                        this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                        this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }

        const noise = new SimplexNoise(42);

        // НАСТРОЙКИ
        const CHUNK_SIZE = 16;
        const RENDER_DISTANCE = 3;
        const BLOCK_SIZE = 1;
        const GRAVITY = 0.02;
        const JUMP_FORCE = 0.35;
        const WALK_SPEED = 0.12;
        const RUN_SPEED = 0.22;

        const BLOCK_TYPES = {
            DIRT: { color: 0x8B4513 },
            GRASS: { color: 0x228B22 },
            STONE: { color: 0x808080 },
            WATER: { color: 0x1E90FF },
            SAND: { color: 0xF4A460 }
        };

        // СЦЕНА
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ОСВЕЩЕНИЕ
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        sun.shadow.camera.left = -50;
        sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50;
        sun.shadow.camera.bottom = -50;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // МИР
        const chunks = new Map();
        const chunkMeshes = new Map();
        const blockGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        const blockMaterials = {};
        Object.keys(BLOCK_TYPES).forEach(key => {
            blockMaterials[key] = new THREE.MeshLambertMaterial({ color: BLOCK_TYPES[key].color });
        });

        function getChunkKey(cx, cz) { return `${cx},${cz}`; }

        function getHeight(wx, wz) {
            const scale = 0.08;
            let h = 0;
            h += noise.noise3D(wx * scale, 0, wz * scale) * 8;
            h += noise.noise3D(wx * scale * 2, 0, wz * scale * 2) * 4;
            h += noise.noise3D(wx * scale * 4, 0, wz * scale * 4) * 2;
            return Math.floor(h);
        }

        function getBlockType(wx, wz, wy, height) {
            if (wy < height - 3) return 'STONE';
            if (wy < height) return 'DIRT';
            if (wy === height) {
                if (height < -2) return 'WATER';
                if (height < 0) return 'SAND';
                return 'GRASS';
            }
            return null;
        }

        function generateChunk(cx, cz) {
            const key = getChunkKey(cx, cz);
            if (chunks.has(key)) return;

            const chunk = {};
            const startX = cx * CHUNK_SIZE;
            const startZ = cz * CHUNK_SIZE;

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wx = startX + x;
                    const wz = startZ + z;
                    const height = getHeight(wx, wz);

                    for (let y = height - 5; y <= height + 1; y++) {
                        const blockType = getBlockType(wx, wz, y, height);
                        if (blockType) {
                            chunk[`${wx},${y},${wz}`] = blockType;
                        }
                    }
                }
            }

            chunks.set(key, chunk);
            buildChunkMesh(cx, cz, chunk);
        }

        function buildChunkMesh(cx, cz, chunk) {
            const key = getChunkKey(cx, cz);
            if (chunkMeshes.has(key)) {
                chunkMeshes.get(key).forEach(mesh => scene.remove(mesh));
            }

            const meshes = [];
            const instances = {};
            Object.keys(BLOCK_TYPES).forEach(type => instances[type] = []);

            Object.entries(chunk).forEach(([blockKey, blockType]) => {
                const [wx, wy, wz] = blockKey.split(',').map(Number);
                instances[blockType].push({ x: wx, y: wy, z: wz });
            });

            Object.entries(instances).forEach(([type, blocks]) => {
                if (blocks.length === 0) return;
                const mesh = new THREE.InstancedMesh(blockGeometry, blockMaterials[type], blocks.length);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                const dummy = new THREE.Object3D();
                blocks.forEach((block, i) => {
                    dummy.position.set(block.x, block.y, block.z);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });
                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);
                meshes.push(mesh);
            });

            chunkMeshes.set(key, meshes);
        }

        function updateChunks(playerX, playerZ) {
            const pcx = Math.floor(playerX / CHUNK_SIZE);
            const pcz = Math.floor(playerZ / CHUNK_SIZE);

            for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
                for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
                    generateChunk(pcx + dx, pcz + dz);
                }
            }

            chunkMeshes.forEach((meshes, key) => {
                const [cx, cz] = key.split(',').map(Number);
                if (Math.abs(cx - pcx) > RENDER_DISTANCE + 1 || Math.abs(cz - pcz) > RENDER_DISTANCE + 1) {
                    meshes.forEach(mesh => scene.remove(mesh));
                    chunkMeshes.delete(key);
                    chunks.delete(key);
                }
            });
        }

        // ПЕРСОНАЖ (вид от третьего лица)
        const player = new THREE.Group();
        scene.add(player);

        // Тело
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 1.2, 0.4),
            new THREE.MeshLambertMaterial({ color: 0x4444ff })
        );
        body.position.y = 0.6;
        body.castShadow = true;
        player.add(body);

        // Голова
        const head = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshLambertMaterial({ color: 0xffcc99 })
        );
        head.position.y = 1.45;
        head.castShadow = true;
        player.add(head);

        // Руки
        const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x4444ff });
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(-0.4, 0.8, 0);
        leftArm.castShadow = true;
        player.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(0.4, 0.8, 0);
        rightArm.castShadow = true;
        player.add(rightArm);

        // Ноги
        const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
        const legMat = new THREE.MeshLambertMaterial({ color: 0x2222aa });
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.15, 0, 0);
        leftLeg.castShadow = true;
        player.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.15, 0, 0);
        rightLeg.castShadow = true;
        player.add(rightLeg);

        player.position.set(0, 20, 0);

        // Камера (следует за игроком)
        const cameraOffset = new THREE.Vector3(0, 3, 6);

        // УПРАВЛЕНИЕ
        const keys = {};
        let isPointerLocked = false;
        let selectedSlot = 0;
        let gameMode = 'walk';

        const playerState = {
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: false,
            rotation: 0,
            cameraAngle: 0,
            cameraPitch: 0.3
        };

        document.getElementById('instructions').addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
            document.getElementById('instructions').style.display = isPointerLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            playerState.cameraAngle -= e.movementX * 0.003;
            playerState.cameraPitch -= e.movementY * 0.003;
            playerState.cameraPitch = Math.max(-0.5, Math.min(1.2, playerState.cameraPitch));
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit5') {
                selectedSlot = parseInt(e.code.charAt(5)) - 1;
                document.querySelectorAll('.hotbar-slot').forEach((slot, i) => {
                    slot.classList.toggle('active', i === selectedSlot);
                });
            }
            if (e.code === 'KeyF') {
                gameMode = gameMode === 'walk' ? 'fly' : 'walk';
                document.getElementById('mode').innerText = gameMode === 'walk' ? 'ХОДЬБА' : 'ПОЛЁТ';
                playerState.velocity.set(0, 0, 0);
            }
        });

        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // Raycaster
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6;

        document.addEventListener('mousedown', (e) => {
            if (!isPointerLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const allMeshes = [];
            chunkMeshes.forEach(meshes => allMeshes.push(...meshes));
            const intersects = raycaster.intersectObjects(allMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const blockPos = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(e.button === 2 ? 0.5 : -0.5));
                const bx = Math.round(blockPos.x);
                const by = Math.round(blockPos.y);
                const bz = Math.round(blockPos.z);

                const cx = Math.floor(bx / CHUNK_SIZE);
                const cz = Math.floor(bz / CHUNK_SIZE);
                const key = getChunkKey(cx, cz);
                const chunk = chunks.get(key);

                if (e.button === 0 && chunk) {
                    delete chunk[`${bx},${by},${bz}`];
                    buildChunkMesh(cx, cz, chunk);
                } else if (e.button === 2 && chunk) {
                    const blockTypes = Object.keys(BLOCK_TYPES);
                    chunk[`${bx},${by},${bz}`] = blockTypes[selectedSlot];
                    buildChunkMesh(cx, cz, chunk);
                }
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ФИЗИКА И ДВИЖЕНИЕ
        function getBlockAt(x, y, z) {
            const cx = Math.floor(x / CHUNK_SIZE);
            const cz = Math.floor(z / CHUNK_SIZE);
            const key = getChunkKey(cx, cz);
            const chunk = chunks.get(key);
            if (!chunk) return null;
            return chunk[`${Math.round(x)},${Math.round(y)},${Math.round(z)}`];
        }

        function checkCollision(pos) {
            const x = Math.round(pos.x);
            const y = Math.round(pos.y);
            const z = Math.round(pos.z);
            return getBlockAt(x, y, z) !== null;
        }

        function updatePlayer() {
            const isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
            const speed = isRunning ? RUN_SPEED : WALK_SPEED;

            if (gameMode === 'walk') {
                // Направление движения относительно камеры
                const forward = new THREE.Vector3(-Math.sin(playerState.cameraAngle), 0, -Math.cos(playerState.cameraAngle));
                const right = new THREE.Vector3(Math.cos(playerState.cameraAngle), 0, -Math.sin(playerState.cameraAngle));

                const moveDir = new THREE.Vector3(0, 0, 0);
                if (keys['KeyW']) moveDir.add(forward);
                if (keys['KeyS']) moveDir.sub(forward);
                if (keys['KeyD']) moveDir.add(right);
                if (keys['KeyA']) moveDir.sub(right);

                if (moveDir.length() > 0) {
                    moveDir.normalize().multiplyScalar(speed);
                    playerState.velocity.x = moveDir.x;
                    playerState.velocity.z = moveDir.z;

                    // Поворот персонажа в направлении движения
                    playerState.rotation = Math.atan2(moveDir.x, moveDir.z);
                } else {
                    playerState.velocity.x *= 0.8;
                    playerState.velocity.z *= 0.8;
                }

                // ПРЫЖОК
                if (keys['Space'] && playerState.onGround) {
                    playerState.velocity.y = JUMP_FORCE;
                    playerState.onGround = false;
                }

                // Гравитация
                playerState.velocity.y -= GRAVITY;

                // Применение скорости с коллизиями
                const newPos = player.position.clone();

                newPos.x += playerState.velocity.x;
                if (checkCollision(new THREE.Vector3(newPos.x, player.position.y + 0.5, player.position.z))) {
                    newPos.x = player.position.x;
                    playerState.velocity.x = 0;
                }

                newPos.z += playerState.velocity.z;
                if (checkCollision(new THREE.Vector3(newPos.x, player.position.y + 0.5, newPos.z))) {
                    newPos.z = player.position.z;
                    playerState.velocity.z = 0;
                }

                newPos.y += playerState.velocity.y;
                if (checkCollision(new THREE.Vector3(newPos.x, newPos.y + 0.5, newPos.z))) {
                    if (playerState.velocity.y < 0) playerState.onGround = true;
                    newPos.y = player.position.y;
                    playerState.velocity.y = 0;
                } else {
                    playerState.onGround = false;
                }

                player.position.copy(newPos);

            } else {
                // Режим полёта
                const forward = new THREE.Vector3(-Math.sin(playerState.cameraAngle), 0, -Math.cos(playerState.cameraAngle));
                const right = new THREE.Vector3(Math.cos(playerState.cameraAngle), 0, -Math.sin(playerState.cameraAngle));

                const moveDir = new THREE.Vector3(0, 0, 0);
                if (keys['KeyW']) moveDir.add(forward);
                if (keys['KeyS']) moveDir.sub(forward);
                if (keys['KeyD']) moveDir.add(right);
                if (keys['KeyA']) moveDir.sub(right);
                if (keys['Space']) moveDir.y += 1;
                if (keys['ShiftLeft']) moveDir.y -= 1;

                if (moveDir.length() > 0) {
                    moveDir.normalize().multiplyScalar(speed * 2);
                    player.position.add(moveDir);
                    playerState.rotation = Math.atan2(moveDir.x, moveDir.z);
                }
            }

            // Поворот персонажа
            player.rotation.y = playerState.rotation;

            // Анимация ходьбы
            const isMoving = Math.abs(playerState.velocity.x) > 0.01 || Math.abs(playerState.velocity.z) > 0.01;
            if (isMoving && playerState.onGround) {
                const walkCycle = Math.sin(Date.now() * 0.01) * 0.5;
                leftLeg.rotation.x = walkCycle;
                rightLeg.rotation.x = -walkCycle;
                leftArm.rotation.x = -walkCycle * 0.5;
                rightArm.rotation.x = walkCycle * 0.5;
            } else {
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
            }

            // Камера следует за игроком
            const camX = player.position.x + Math.sin(playerState.cameraAngle) * 6;
            const camY = player.position.y + 3 + playerState.cameraPitch * 5;
            const camZ = player.position.z + Math.cos(playerState.cameraAngle) * 6;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);
        }

        // ЦИКЛ
        let frameCount = 0;
        let fpsTime = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            frameCount++;
            fpsTime += dt;
            if (fpsTime >= 1) {
                document.getElementById('fps').innerText = frameCount;
                frameCount = 0;
                fpsTime = 0;
            }

            updatePlayer();
            updateChunks(player.position.x, player.position.z);

            document.getElementById('position').innerText =
                `${Math.floor(player.position.x)}, ${Math.floor(player.position.y)}, ${Math.floor(player.position.z)}`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
