<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetherbound - Minecraft Mode</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            cursor: none;
            font-family: monospace;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-size: 16px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffcc;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            display: none;
        }

            #crosshair::before, #crosshair::after {
                content: '';
                position: absolute;
                background: white;
            }

            #crosshair::before {
                width: 2px;
                height: 20px;
                left: 9px;
            }

            #crosshair::after {
                width: 20px;
                height: 2px;
                top: 9px;
            }

        #mode-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            color: yellow;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div> СКОРОСТЬ: <span id="speed">0</span> км/с</div>
        <div>📡 ВЫСОТА: <span id="altitude">0</span> км</div>
        <div>🎯 РЕЖИМ: <span id="mode">ПОЛЁТ</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="mode-indicator">F - полёт | G - ходьба</div>
    <div id="controls">
        <b>ПОЛЁТ:</b> W (газ), Мышь (поворот)<br>
        <b>ХОДЬБА:</b> WASD (движение), Пробел (прыжок), Мышь (обзор)
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ШУМ ПЕРЛИНА (упрощённая реализация)
        class SimplexNoise {
            constructor() {
                this.p = new Uint8Array(512);
                const perm = new Uint8Array(256);
                for (let i = 0; i < 256; i++) perm[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [perm[i], perm[j]] = [perm[j], perm[i]];
                }
                for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
            }

            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            noise3D(x, y, z) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                const Z = Math.floor(z) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                z -= Math.floor(z);
                const u = this.fade(x);
                const v = this.fade(y);
                const w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z;
                const B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                        this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }

        const simplex = new SimplexNoise();

        // Функция получения высоты рельефа
        function getTerrainHeight(x, y, z) {
            const scale = 0.02;
            const amplitude = 8;
            let height = 0;
            height += simplex.noise3D(x * scale, y * scale, z * scale) * amplitude;
            height += simplex.noise3D(x * scale * 2, y * scale * 2, z * scale * 2) * amplitude * 0.5;
            height += simplex.noise3D(x * scale * 4, y * scale * 4, z * scale * 4) * amplitude * 0.25;
            return height;
        }

        // СЦЕНА
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 100, 1000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // СВЕТ
        scene.add(new THREE.AmbientLight(0x404040, 1.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(100, 100, 100);
        scene.add(sun);

        // ПЛАНЕТА С РЕЛЬЕФОМ
        const planetRadius = 100;
        const planetGeo = new THREE.SphereGeometry(planetRadius, 128, 128);
        const positions = planetGeo.attributes.position;

        // Модифицируем вершины для создания гор
        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const y = positions.getY(i);
            const z = positions.getZ(i);
            const height = getTerrainHeight(x, y, z);
            const length = Math.sqrt(x * x + y * y + z * z);
            const scale = (planetRadius + height) / length;
            positions.setXYZ(i, x * scale, y * scale, z * scale);
        }

        planetGeo.computeVertexNormals();

        const planet = new THREE.Mesh(planetGeo, new THREE.MeshPhongMaterial({
            color: 0x2244ff,
            emissive: 0x001133,
            shininess: 15,
            flatShading: true
        }));
        scene.add(planet);

        // Атмосфера
        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(planetRadius * 1.1, 32, 32),
            new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.2,
                side: THREE.BackSide
            })
        );
        scene.add(atmosphere);

        // ЗВЕЗДЫ
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(5000 * 3);
        for (let i = 0; i < 5000 * 3; i++) {
            starsPos[i] = (Math.random() - 0.5) * 5000;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 })));

        // КОРАБЛЬ
        const ship = new THREE.Group();
        scene.add(ship);

        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1.5, 12, 8),
            new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 50 })
        );
        body.rotation.x = Math.PI / 2;
        ship.add(body);

        const nose = new THREE.Mesh(
            new THREE.ConeGeometry(1, 6, 8),
            new THREE.MeshPhongMaterial({ color: 0xff2222, shininess: 50 })
        );
        nose.rotation.x = Math.PI / 2;
        nose.position.z = -9;
        ship.add(nose);

        const wings = new THREE.Mesh(
            new THREE.BoxGeometry(14, 0.3, 4),
            new THREE.MeshPhongMaterial({ color: 0x999999 })
        );
        wings.position.z = 2;
        ship.add(wings);

        const cockpit = new THREE.Mesh(
            new THREE.SphereGeometry(1, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshPhongMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 })
        );
        cockpit.rotation.x = Math.PI / 2;
        cockpit.position.set(0, 0.8, -2);
        ship.add(cockpit);

        const eng1 = new THREE.Mesh(
            new THREE.CylinderGeometry(0.7, 1, 3, 8),
            new THREE.MeshPhongMaterial({ color: 0x444444 })
        );
        eng1.rotation.x = Math.PI / 2;
        eng1.position.set(-2.5, 0, 6);
        ship.add(eng1);

        const eng2 = new THREE.Mesh(
            new THREE.CylinderGeometry(0.7, 1, 3, 8),
            new THREE.MeshPhongMaterial({ color: 0x444444 })
        );
        eng2.rotation.x = Math.PI / 2;
        eng2.position.set(2.5, 0, 6);
        ship.add(eng2);

        const flame1 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6, 3, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        flame1.rotation.x = -Math.PI / 2;
        flame1.position.set(-2.5, 0, 7.5);
        flame1.visible = false;
        ship.add(flame1);

        const flame2 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6, 3, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        flame2.rotation.x = -Math.PI / 2;
        flame2.position.set(2.5, 0, 7.5);
        flame2.visible = false;
        ship.add(flame2);

        ship.position.set(0, 150, 0);

        // ИГРОК (для режима ходьбы)
        const player = {
            position: new THREE.Vector3(0, planetRadius + 10, 0),
            velocity: new THREE.Vector3(),
            onGround: false,
            height: 2,
            speed: 0.3,
            jumpForce: 0.5
        };

        // РЕЖИМЫ
        let mode = 'fly'; // 'fly' или 'walk'
        const crosshair = document.getElementById('crosshair');

        // КАМЕРА
        camera.position.set(0, 5, 20);
        camera.rotation.x = -0.1;
        ship.add(camera);

        // УПРАВЛЕНИЕ
        let speed = 0;
        const keys = {};
        let touching = false;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            // Переключение режимов
            if (e.code === 'KeyF') {
                mode = 'fly';
                ship.visible = true;
                crosshair.style.display = 'none';
                document.getElementById('mode').innerText = 'ПОЛЁТ';
                ship.position.copy(player.position);
                ship.position.y += 5;
            }
            if (e.code === 'KeyG') {
                mode = 'walk';
                ship.visible = false;
                crosshair.style.display = 'block';
                document.getElementById('mode').innerText = 'ХОДЬБА';
                player.position.copy(ship.position);
                player.position.y = planetRadius + 5;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        let mouseDown = false;
        window.addEventListener('mousedown', () => mouseDown = true);
        window.addEventListener('mouseup', () => mouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (mode === 'fly' && mouseDown && !touching) {
                ship.rotation.y -= e.movementX * 0.005;
                ship.rotation.x -= e.movementY * 0.005;
                ship.rotation.x = Math.max(-1.2, Math.min(1.2, ship.rotation.x));
            } else if (mode === 'walk') {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        });

        window.addEventListener('touchstart', (e) => {
            touching = true;
        });

        window.addEventListener('touchend', () => {
            touching = false;
        });

        // ФИЗИКА ХОДЬБЫ
        function updatePlayer() {
            if (mode !== 'walk') return;

            // Движение
            const direction = new THREE.Vector3();
            if (keys['KeyW']) direction.z -= 1;
            if (keys['KeyS']) direction.z += 1;
            if (keys['KeyA']) direction.x -= 1;
            if (keys['KeyD']) direction.x += 1;

            direction.normalize();
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);

            player.velocity.x = direction.x * player.speed;
            player.velocity.z = direction.z * player.speed;

            // Прыжок
            if (keys['Space'] && player.onGround) {
                player.velocity.y = player.jumpForce;
                player.onGround = false;
            }

            // Гравитация
            player.velocity.y -= 0.02;

            // Применение скорости
            player.position.add(player.velocity);

            // Проверка столкновения с поверхностью
            const distFromCenter = player.position.length();
            const surfaceHeight = planetRadius + getTerrainHeight(
                player.position.x, player.position.y, player.position.z
            );

            if (distFromCenter < surfaceHeight + player.height) {
                player.position.normalize().multiplyScalar(surfaceHeight + player.height);
                player.velocity.y = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }

            // Камера следует за игроком
            camera.position.copy(player.position);
            camera.position.y += player.height;
        }

        // ЦИКЛ
        function animate() {
            requestAnimationFrame(animate);

            planet.rotation.y += 0.0001;
            atmosphere.rotation.y += 0.0001;

            if (mode === 'fly') {
                // Режим полёта
                if (keys['KeyW'] || keys['ArrowUp'] || touching) {
                    speed = Math.min(speed + 0.15, 5);
                } else {
                    speed *= 0.95;
                }

                ship.translateZ(-speed);

                if (speed > 0.3) {
                    flame1.visible = true;
                    flame2.visible = true;
                    const scale = 0.8 + Math.random() * 0.4;
                    flame1.scale.set(scale, scale, scale);
                    flame2.scale.set(scale, scale, scale);
                } else {
                    flame1.visible = false;
                    flame2.visible = false;
                }

                if (keys['KeyA'] || keys['ArrowLeft']) {
                    ship.rotation.z += (0.5 - ship.rotation.z) * 0.1;
                } else if (keys['KeyD'] || keys['ArrowRight']) {
                    ship.rotation.z += (-0.5 - ship.rotation.z) * 0.1;
                } else {
                    ship.rotation.z += (0 - ship.rotation.z) * 0.1;
                }

                const altitude = Math.max(0, ship.position.length() - planetRadius);
                document.getElementById('speed').innerText = (speed * 100).toFixed(0);
                document.getElementById('altitude').innerText = altitude.toFixed(0);

                if (altitude < 5) {
                    speed = 0;
                    const dir = ship.position.clone().normalize();
                    ship.position.copy(dir.multiplyScalar(planetRadius + 5));
                }
            } else {
                // Режим ходьбы
                updatePlayer();
                const altitude = Math.max(0, player.position.length() - planetRadius);
                document.getElementById('speed').innerText = '0';
                document.getElementById('altitude').innerText = altitude.toFixed(1);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
