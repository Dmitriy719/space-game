<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetherbound - Voxel Worlds</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            cursor: none;
            font-family: monospace;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffcc;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            display: none;
        }

            #crosshair::before, #crosshair::after {
                content: '';
                position: absolute;
                background: white;
            }

            #crosshair::before {
                width: 2px;
                height: 20px;
                left: 9px;
            }

            #crosshair::after {
                width: 20px;
                height: 2px;
                top: 9px;
            }

        #planet-info {
            position: absolute;
            top: 15px;
            right: 15px;
            color: yellow;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }

        #inventory {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: white;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        #weather-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>🚀 СКОРОСТЬ: <span id="speed">0</span> км/с</div>
        <div>📡 ВЫСОТА: <span id="altitude">0</span> км</div>
        <div>🎯 РЕЖИМ: <span id="mode">ПОЛЁТ</span></div>
        <div>️ ТЕМПЕРАТУРА: <span id="temp">0</span>°C</div>
    </div>
    <div id="crosshair"></div>
    <div id="planet-info">
        <b>ПЛАНЕТА:</b> <span id="planet-name">Земля</span><br>
        <div>️ ПОГОДА: <span id="weather">Ясно</span></div>
        <div>📍 Планет: <span id="planet-count">3</span></div>
    </div>
    <div id="inventory">
        <b>ИНВЕНТАРЬ:</b>
        <div>💎 Кристаллы: <span id="crystals">0</span></div>
        <div>⛏️ Блоки: <span id="blocks">0</span></div>
    </div>
    <canvas id="weather-effect"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ШУМ ПЕРЛИНА
        class SimplexNoise {
            constructor() {
                this.p = new Uint8Array(512);
                const perm = new Uint8Array(256);
                for (let i = 0; i < 256; i++) perm[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [perm[i], perm[j]] = [perm[j], perm[i]];
                }
                for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise3D(x, y, z) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = this.fade(x), v = this.fade(y), w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z;
                const B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                        this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }

        const simplex = new SimplexNoise();

        // ТИПЫ ПЛАНЕТ С ПОГОДОЙ
        const planetTypes = {
            earth: {
                name: 'Земля',
                colors: { grass: 0x3d8e3d, dirt: 0x6e5a3d, stone: 0x666666, water: 0x1a3d6e, snow: 0xffffff },
                weather: ['clear', 'rain', 'cloudy'],
                temp: 20,
                gravity: 0.02
            },
            desert: {
                name: 'Пустыня',
                colors: { sand: 0xd4a574, stone: 0x8B7355, cactus: 0x2d5a2d, sky: 0xffaa55 },
                weather: ['clear', 'sandstorm', 'hot'],
                temp: 45,
                gravity: 0.018
            },
            ice: {
                name: 'Ледяная',
                colors: { ice: 0x88ccff, snow: 0xffffff, stone: 0x556677, water: 0x4488aa },
                weather: ['snow', 'blizzard', 'clear'],
                temp: -30,
                gravity: 0.015
            },
            lava: {
                name: 'Вулканическая',
                colors: { lava: 0xff4400, rock: 0x222222, ash: 0x333333, fire: 0xff6600 },
                weather: ['ash', 'eruption', 'clear'],
                temp: 200,
                gravity: 0.025
            }
        };

        // ВОКСЕЛЬНАЯ ГЕНЕРАЦИЯ
        function generateVoxelPlanet(planetType, radius, detail) {
            const voxels = [];
            const blockSize = 2;
            const colors = planetType.colors;

            for (let x = -radius; x <= radius; x += blockSize) {
                for (let z = -radius; z <= radius; z += blockSize) {
                    for (let y = -radius; y <= radius; y += blockSize) {
                        const dist = Math.sqrt(x * x + y * y + z * z);
                        const noise = simplex.noise3D(x * 0.02, y * 0.02, z * 0.02);
                        const surfaceDist = radius + noise * 10;

                        if (dist <= surfaceDist && dist > surfaceDist - 10) {
                            let color;
                            if (planetType === 'earth') {
                                if (dist > surfaceDist - 1) color = noise > 0.3 ? colors.grass : colors.dirt;
                                else if (noise < -0.3) color = colors.water;
                                else color = colors.stone;
                            } else if (planetType === 'desert') {
                                color = dist > surfaceDist - 1 ? colors.sand : colors.stone;
                            } else if (planetType === 'ice') {
                                color = dist > surfaceDist - 1 ? colors.ice : colors.stone;
                            } else if (planetType === 'lava') {
                                color = dist > surfaceDist - 2 ? colors.lava : colors.rock;
                            }

                            if (color !== undefined) {
                                voxels.push({ x, y, z, color, size: blockSize });
                            }
                        }
                    }
                }
            }
            return voxels;
        }

        // СИСТЕМА ПОГОДЫ
        class WeatherSystem {
            constructor(scene, camera) {
                this.scene = scene;
                this.camera = camera;
                this.particles = [];
                this.canvas = document.getElementById('weather-effect');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.currentWeather = 'clear';
                this.intensity = 0;
            }

            setWeather(type, intensity) {
                this.currentWeather = type;
                this.intensity = intensity;
                this.canvas.style.display = type !== 'clear' ? 'block' : 'none';

                // Создаём частицы
                this.particles = [];
                const count = intensity * 1000;

                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        z: Math.random() * 100,
                        vx: (Math.random() - 0.5) * 2,
                        vy: type === 'snow' ? 1 + Math.random() : 5 + Math.random() * 5,
                        size: Math.random() * 3 + 1
                    });
                }
            }

            update() {
                if (this.currentWeather === 'clear') return;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Цвет частиц в зависимости от погоды
                let color;
                if (this.currentWeather === 'rain') color = 'rgba(100, 150, 255, 0.6)';
                else if (this.currentWeather === 'snow') color = 'rgba(255, 255, 255, 0.8)';
                else if (this.currentWeather === 'sandstorm') color = 'rgba(210, 180, 140, 0.4)';
                else if (this.currentWeather === 'blizzard') color = 'rgba(200, 220, 255, 0.5)';
                else if (this.currentWeather === 'ash') color = 'rgba(50, 50, 50, 0.6)';
                else return;

                this.ctx.fillStyle = color;

                this.particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;

                    if (p.y > this.canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * this.canvas.width;
                    }

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }
        }

        // СЦЕНА
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 50, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ОСВЕЩЕНИЕ
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(100, 100, 100);
        sun.castShadow = true;
        scene.add(sun);

        // МНОЖЕСТВО ПЛАНЕТ
        const planets = [];
        const planetData = [
            { type: 'earth', position: [0, 0, 0], radius: 50 },
            { type: 'desert', position: [300, 50, 0], radius: 40 },
            { type: 'ice', position: [-300, 30, 100], radius: 45 },
            { type: 'lava', position: [0, -200, 200], radius: 35 }
        ];

        planetData.forEach(data => {
            const voxels = generateVoxelPlanet(data.type, data.radius, 2);
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const planetGroup = new THREE.Group();

            voxels.forEach(v => {
                const material = new THREE.MeshPhongMaterial({ color: v.color });
                const voxel = new THREE.Mesh(geometry, material);
                voxel.position.set(v.x, v.y, v.z);
                voxel.castShadow = true;
                voxel.receiveShadow = true;
                planetGroup.add(voxel);
            });

            planetGroup.position.set(...data.position);
            scene.add(planetGroup);

            planets.push({
                mesh: planetGroup,
                type: planetTypes[data.type],
                position: new THREE.Vector3(...data.position),
                radius: data.radius
            });
        });

        // ЗВЁЗДЫ
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(5000 * 3);
        for (let i = 0; i < 5000 * 3; i++) starsPos[i] = (Math.random() - 0.5) * 5000;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 })));

        // КОРАБЛЬ
        const ship = new THREE.Group();
        scene.add(ship);

        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1.5, 12, 8),
            new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 50 })
        );
        body.rotation.x = Math.PI / 2;
        body.castShadow = true;
        ship.add(body);

        const nose = new THREE.Mesh(
            new THREE.ConeGeometry(1, 6, 8),
            new THREE.MeshPhongMaterial({ color: 0xff2222, shininess: 50 })
        );
        nose.rotation.x = Math.PI / 2;
        nose.position.z = -9;
        ship.add(nose);

        const wings = new THREE.Mesh(
            new THREE.BoxGeometry(14, 0.3, 4),
            new THREE.MeshPhongMaterial({ color: 0x999999 })
        );
        wings.position.z = 2;
        ship.add(wings);

        const flame1 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6, 3, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        flame1.rotation.x = -Math.PI / 2;
        flame1.position.set(-2.5, 0, 7.5);
        flame1.visible = false;
        ship.add(flame1);

        const flame2 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6, 3, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        flame2.rotation.x = -Math.PI / 2;
        flame2.position.set(2.5, 0, 7.5);
        flame2.visible = false;
        ship.add(flame2);

        ship.position.set(0, 100, 0);

        // КАМЕРА
        camera.position.set(0, 5, 20);
        ship.add(camera);

        // ПОГОДА
        const weatherSystem = new WeatherSystem(scene, camera);

        // УПРАВЛЕНИЕ
        let speed = 0;
        const keys = {};
        let currentPlanet = planets[0];

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        let mouseDown = false;
        window.addEventListener('mousedown', () => mouseDown = true);
        window.addEventListener('mouseup', () => mouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (mouseDown) {
                ship.rotation.y -= e.movementX * 0.005;
                ship.rotation.x -= e.movementY * 0.005;
                ship.rotation.x = Math.max(-1.2, Math.min(1.2, ship.rotation.x));
            }
        });

        // ЦИКЛ
        function animate() {
            requestAnimationFrame(animate);

            // Движение
            if (keys['KeyW'] || keys['ArrowUp']) {
                speed = Math.min(speed + 0.15, 5);
            } else {
                speed *= 0.95;
            }

            ship.translateZ(-speed);

            // Двигатели
            if (speed > 0.3) {
                flame1.visible = true;
                flame2.visible = true;
                flame1.scale.setScalar(0.8 + Math.random() * 0.4);
                flame2.scale.setScalar(0.8 + Math.random() * 0.4);
            } else {
                flame1.visible = false;
                flame2.visible = false;
            }

            // Определение ближайшей планеты и погоды
            let minDist = Infinity;
            planets.forEach(planet => {
                const dist = ship.position.distanceTo(planet.position);
                if (dist < minDist) {
                    minDist = dist;
                    currentPlanet = planet;
                }
            });

            // Обновление погоды
            const weatherIndex = Math.floor(Math.random() * currentPlanet.type.weather.length);
            const weather = currentPlanet.type.weather[weatherIndex];
            const weatherNames = { clear: 'Ясно', rain: 'Дождь', snow: 'Снег', sandstorm: 'Песчаная буря', blizzard: 'Метель', ash: 'Пепел', cloudy: 'Облачно', hot: 'Жара', eruption: 'Извержение' };

            weatherSystem.setWeather(weather, 0.5);
            weatherSystem.update();

            // UI
            document.getElementById('speed').innerText = (speed * 100).toFixed(0);
            document.getElementById('altitude').innerText = minDist.toFixed(0);
            document.getElementById('planet-name').innerText = currentPlanet.type.name;
            document.getElementById('weather').innerText = weatherNames[weather] || weather;
            document.getElementById('temp').innerText = currentPlanet.type.temp;

            // Вращение планет
            planets.forEach(p => p.mesh.rotation.y += 0.0005);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
