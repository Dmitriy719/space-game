<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Aetherbound</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            cursor: none;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 16px;
            z-index: 100;
            pointer-events: none;
        }

        #debug {
            position: absolute;
            top: 15px;
            right: 15px;
            color: yellow;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>СКОРОСТЬ: <span id="speed">0</span></div>
        <div>ВЫСОТА: <span id="altitude">0</span></div>
    </div>
    <div id="debug">Отладка:</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const debug = document.getElementById('debug');
        function log(msg) {
            debug.innerHTML += '<br>' + msg;
            console.log(msg);
        }

        log('Запуск игры...');

        // СЦЕНА
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        log('Сцена создана');

        // СВЕТ
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(100, 100, 100);
        scene.add(sun);
        log('Свет добавлен');

        // ПЛАНЕТА
        const planet = new THREE.Mesh(
            new THREE.SphereGeometry(100, 32, 32),
            new THREE.MeshPhongMaterial({ color: 0x2244ff })
        );
        scene.add(planet);
        log('Планета создана');

        // ЗВЕЗДЫ
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(3000 * 3);
        for (let i = 0; i < 3000 * 3; i++) starsPos[i] = (Math.random() - 0.5) * 5000;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1 })));
        log('Звезды созданы');

        // КОРАБЛЬ
        const ship = new THREE.Group();
        scene.add(ship);

        // Корпус
        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1.5, 10, 8),
            new THREE.MeshPhongMaterial({ color: 0xcccccc })
        );
        body.rotation.x = Math.PI / 2;
        ship.add(body);

        // Нос
        const nose = new THREE.Mesh(
            new THREE.ConeGeometry(1, 4, 8),
            new THREE.MeshPhongMaterial({ color: 0xff2222 })
        );
        nose.rotation.x = Math.PI / 2;
        nose.position.z = -7;
        ship.add(nose);

        // Крылья
        const wings = new THREE.Mesh(
            new THREE.BoxGeometry(10, 0.2, 3),
            new THREE.MeshPhongMaterial({ color: 0x888888 })
        );
        wings.position.z = 1;
        ship.add(wings);

        // Двигатели
        const eng1 = new THREE.Mesh(
            new THREE.CylinderGeometry(0.6, 0.8, 2, 8),
            new THREE.MeshPhongMaterial({ color: 0x444444 })
        );
        eng1.rotation.x = Math.PI / 2;
        eng1.position.set(-2, 0, 5);
        ship.add(eng1);

        const eng2 = new THREE.Mesh(
            new THREE.CylinderGeometry(0.6, 0.8, 2, 8),
            new THREE.MeshPhongMaterial({ color: 0x444444 })
        );
        eng2.rotation.x = Math.PI / 2;
        eng2.position.set(2, 0, 5);
        ship.add(eng2);

        // Свечение двигателей
        const glow1 = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        glow1.position.set(-2, 0, 6);
        glow1.visible = false;
        ship.add(glow1);

        const glow2 = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        glow2.position.set(2, 0, 6);
        glow2.visible = false;
        ship.add(glow2);

        ship.position.set(0, 150, 0);
        log('Корабль создан на позиции: ' + ship.position.x + ', ' + ship.position.y + ', ' + ship.position.z);

        // КАМЕРА
        camera.position.set(0, 3, 12);
        ship.add(camera);
        log('Камера прикреплена к кораблю');

        // УПРАВЛЕНИЕ
        let speed = 0;
        const keys = {};
        let touching = false;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            log('Клавиша: ' + e.code);
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        let mouseDown = false;
        window.addEventListener('mousedown', () => mouseDown = true);
        window.addEventListener('mouseup', () => mouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (mouseDown && !touching) {
                ship.rotation.y -= e.movementX * 0.005;
                ship.rotation.x -= e.movementY * 0.005;
            }
        });

        window.addEventListener('touchstart', (e) => {
            touching = true;
            log('Касание начато');
        });

        window.addEventListener('touchend', () => {
            touching = false;
            log('Касание окончено');
        });

        log('=== ВСЁ ГОТОВО. НАЖМИТЕ W ===');

        // ЦИКЛ
        function animate() {
            requestAnimationFrame(animate);

            // ДВИЖЕНИЕ
            if (keys['KeyW'] || keys['ArrowUp'] || touching) {
                speed = Math.min(speed + 0.1, 3);
            } else {
                speed *= 0.95;
            }

            ship.translateZ(-speed);

            // ДВИГАТЕЛИ
            if (speed > 0.2) {
                glow1.visible = true;
                glow2.visible = true;
            } else {
                glow1.visible = false;
                glow2.visible = false;
            }

            // UI
            document.getElementById('speed').innerText = (speed * 100).toFixed(0);
            const alt = Math.max(0, ship.position.length() - 100);
            document.getElementById('altitude').innerText = alt.toFixed(0);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
