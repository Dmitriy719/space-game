<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Aetherbound: Planetary Odyssey</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 5px #00ffcc;
        }

        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 13px;
            pointer-events: none;
            text-align: left;
        }

        #touch-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(0, 255, 204, 0.5);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 99;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>СКОРОСТЬ: <span id="speed">0</span> км/с</div>
        <div>ВЫСОТА: <span id="altitude">0</span> км</div>
    </div>
    <div id="controls-hint">
        💻 ПК: W (газ), A/D (крен), Мышь (поворот)<br>
        📱 Телефон: Касание (газ + свайп для поворота)
    </div>
    <div id="touch-indicator"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. ИНИЦИАЛИЗАЦИЯ
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00015);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 20000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. ОСВЕЩЕНИЕ
        const ambientLight = new THREE.AmbientLight(0x404060, 1.0);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(200, 100, 100);
        scene.add(sunLight);

        // 3. МИР: Планета и Звёзды
        const planetRadius = 100;
        const planet = new THREE.Mesh(
            new THREE.SphereGeometry(planetRadius, 64, 64),
            new THREE.MeshPhongMaterial({ color: 0x1a4d8c, emissive: 0x051020, shininess: 15 })
        );
        scene.add(planet);

        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(planetRadius * 1.15, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.15, side: THREE.BackSide, blending: THREE.AdditiveBlending })
        );
        scene.add(atmosphere);

        const starsGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(6000 * 3);
        for (let i = 0; i < 6000 * 3; i++) posArray[i] = (Math.random() - 0.5) * 8000;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 1.2, color: 0xffffff, transparent: true, opacity: 0.9 })));

        // 4. ДЕТАЛИЗИРОВАННЫЙ КОРАБЛЬ (Сборка из частей)
        const shipGroup = new THREE.Group();

        // Корпус
        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(1.2, 1.8, 10, 8),
            new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3, metalness: 0.8 })
        );
        body.rotation.x = Math.PI / 2;
        shipGroup.add(body);

        // Нос
        const nose = new THREE.Mesh(
            new THREE.ConeGeometry(1.2, 4, 8),
            new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.2, metalness: 0.9 })
        );
        nose.rotation.x = Math.PI / 2;
        nose.position.z = -7;
        shipGroup.add(nose);

        // Крылья
        const wings = new THREE.Mesh(
            new THREE.BoxGeometry(10, 0.3, 3.5),
            new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.4, metalness: 0.7 })
        );
        wings.position.z = 1.5;
        shipGroup.add(wings);

        // Кабина (стекло)
        const cockpit = new THREE.Mesh(
            new THREE.SphereGeometry(1.1, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshPhysicalMaterial({ color: 0x00ffff, emissive: 0x0044aa, emissiveIntensity: 0.5, roughness: 0.1, metalness: 0.9, transmission: 0.6, transparent: true })
        );
        cockpit.rotation.x = Math.PI / 2;
        cockpit.position.set(0, 0.8, -1);
        shipGroup.add(cockpit);

        // Двигатели (левый и правый)
        const engineGeo = new THREE.CylinderGeometry(0.7, 1.1, 3, 8);
        engineGeo.rotateX(Math.PI / 2);
        const engineMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5, metalness: 0.8 });

        const engineL = new THREE.Mesh(engineGeo, engineMat);
        engineL.position.set(-2.2, 0, 5);
        shipGroup.add(engineL);

        const engineR = new THREE.Mesh(engineGeo, engineMat);
        engineR.position.set(2.2, 0, 5);
        shipGroup.add(engineR);

        // Свечение двигателей (Glow)
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const glowL = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), glowMat);
        glowL.position.set(-2.2, 0, 6.6);
        glowL.visible = false;
        shipGroup.add(glowL);

        const glowR = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), glowMat);
        glowR.position.set(2.2, 0, 6.6);
        glowR.visible = false;
        shipGroup.add(glowR);

        // Система частиц для следа двигателя
        const pCount = 300;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        const pLife = new Float32Array(pCount);
        for (let i = 0; i < pCount; i++) { pLife[i] = 0; pPos[i * 3 + 2] = 9999; }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const engineParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({
            color: 0x00ffff, size: 0.8, transparent: true, opacity: 0.8,
            blending: THREE.AdditiveBlending, depthWrite: false
        }));
        shipGroup.add(engineParticles);

        // Позиционируем корабль перед камерой
        shipGroup.position.set(0, -1.5, -6);
        shipGroup.rotation.x = 0.15; // Легкий наклон вверх
        camera.add(shipGroup);
        scene.add(camera);

        camera.position.z = 350;
        camera.position.y = 80;
        camera.lookAt(0, 0, 0);

        // 5. УПРАВЛЕНИЕ
        let speed = 0;
        const maxSpeed = 3.5;
        const keys = { w: false, a: false, s: false, d: false };
        let isTouching = false, touchStartX = 0, touchStartY = 0;
        const touchIndicator = document.getElementById('touch-indicator');

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let isMouseDown = false;
        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (isMouseDown && !isTouching) {
                camera.rotation.y -= e.movementX * 0.003;
                camera.rotation.x -= e.movementY * 0.003;
                camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
            }
        });

        window.addEventListener('touchstart', (e) => {
            isTouching = true; touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
            touchIndicator.style.display = 'block'; touchIndicator.style.left = touchStartX + 'px'; touchIndicator.style.top = touchStartY + 'px';
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return; e.preventDefault();
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            camera.rotation.y -= dx * 0.004;
            camera.rotation.x -= dy * 0.004;
            camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
            touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
            touchIndicator.style.left = touchStartX + 'px'; touchIndicator.style.top = touchStartY + 'px';
        }, { passive: false });

        window.addEventListener('touchend', () => { isTouching = false; touchIndicator.style.display = 'none'; });

        // 6. ИГРОВОЙ ЦИКЛ
        const speedEl = document.getElementById('speed');
        const altitudeEl = document.getElementById('altitude');

        function animate() {
            requestAnimationFrame(animate);
            planet.rotation.y += 0.0003;
            atmosphere.rotation.y += 0.0003;

            // Управление скоростью
            if (keys.w || isTouching) {
                speed = Math.min(speed + 0.03, maxSpeed);
            } else {
                speed *= 0.97;
            }

            // Анимация крена (наклона) корабля при повороте
            let targetRoll = 0;
            if (keys.a) targetRoll = 0.5;
            if (keys.d) targetRoll = -0.5;
            shipGroup.rotation.z += (targetRoll - shipGroup.rotation.z) * 0.1;

            camera.translateZ(-speed);

            // Анимация двигателя и частиц
            if (speed > 0.2) {
                glowL.visible = true; glowR.visible = true;
                glowL.scale.setScalar(0.8 + Math.random() * 0.4);
                glowR.scale.setScalar(0.8 + Math.random() * 0.4);

                // Генерация новых частиц (исправлено для симметрии)
                for (let i = 0; i < 3; i++) {
                    let idx = -1;
                    for (let j = 0; j < pCount; j++) { if (pLife[j] <= 0) { idx = j; break; } }
                    if (idx !== -1) {
                        pLife[idx] = 1.0;
                        // Случайный выбор левого (-2.2) или правого (2.2) двигателя
                        const offset = (Math.random() > 0.5) ? -2.2 : 2.2;
                        pPos[idx * 3] = offset + (Math.random() - 0.5) * 0.4;
                        pPos[idx * 3 + 1] = (Math.random() - 0.5) * 0.4;
                        pPos[idx * 3 + 2] = 6.6;
                    }
                }

                // Движение и старение частиц
                for (let i = 0; i < pCount; i++) {
                    if (pLife[i] > 0) {
                        pLife[i] -= 0.025;
                        pPos[i * 3 + 2] += 0.6 + speed * 0.4; // Летят назад
                        pPos[i * 3 + 1] += (Math.random() - 0.5) * 0.15; // Разлетаются
                    } else {
                        pPos[i * 3 + 2] = 9999; // Прячем
                    }
                }
                engineParticles.geometry.attributes.position.needsUpdate = true;
            } else {
                glowL.visible = false; glowR.visible = false;
                for (let i = 0; i < pCount; i++) { pLife[i] = 0; pPos[i * 3 + 2] = 9999; }
                engineParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Обновление UI
            speedEl.innerText = (speed * 100).toFixed(0);
            const altitude = Math.max(0, camera.position.distanceTo(new THREE.Vector3(0, 0, 0)) - planetRadius);
            altitudeEl.innerText = altitude.toFixed(0);

            // Простая коллизия с поверхностью
            if (altitude < 2) {
                speed = 0;
                const dir = new THREE.Vector3().copy(camera.position).normalize();
                camera.position.copy(dir.multiplyScalar(planetRadius + 2));
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
