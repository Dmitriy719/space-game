<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetherbound - Infinite Voxel Worlds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        canvas {
            display: block;
            cursor: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 100;
        }

            #crosshair::before, #crosshair::after {
                content: '';
                position: absolute;
                background: white;
            }

            #crosshair::before {
                width: 2px;
                height: 24px;
                left: 11px;
                top: 0;
            }

            #crosshair::after {
                width: 24px;
                height: 2px;
                top: 11px;
                left: 0;
            }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 100;
        }

        .hotbar-slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            position: relative;
        }

            .hotbar-slot.active {
                border-color: #fff;
                background: rgba(255,255,255,0.2);
            }

        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
        }

        #mode-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            color: yellow;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 10px;
            z-index: 200;
            text-align: center;
            cursor: pointer;
        }

            #instructions h1 {
                margin-bottom: 20px;
                color: #00ffcc;
            }

            #instructions p {
                margin: 10px 0;
            }

        #debug {
            position: absolute;
            bottom: 80px;
            left: 10px;
            color: #0f0;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border-radius: 5px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h1> AETHERBOUND</h1>
        <p><b>Кликните чтобы начать</b></p>
        <p>WASD - движение | Пробел - прыжок</p>
        <p>ЛКМ - ломать блок | ПКМ - ставить блок</p>
        <p>1-5 - выбор блока | F - полёт/ходьба</p>
        <p>Shift - бег | ESC - меню</p>
    </div>

    <div id="ui">
        <div>🎯 РЕЖИМ: <span id="mode">ХОДЬБА</span></div>
        <div>📍 ПОЗИЦИЯ: <span id="position">0, 0, 0</span></div>
        <div>⚡ FPS: <span id="fps">0</span></div>
    </div>

    <div id="mode-indicator">
        <div>🌍 ПЛАНЕТА: <span id="planet-name">Земля</span></div>
        <div>🌦️ ПОГОДА: <span id="weather">Ясно</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="hotbar">
        <div class="hotbar-slot active" data-slot="0">🟫<span class="slot-count">∞</span></div>
        <div class="hotbar-slot" data-slot="1">🟩<span class="slot-count">∞</span></div>
        <div class="hotbar-slot" data-slot="2">⬜<span class="slot-count">∞</span></div>
        <div class="hotbar-slot" data-slot="3">🟦<span class="slot-count">∞</span></div>
        <div class="hotbar-slot" data-slot="4">🟨<span class="slot-count">∞</span></div>
    </div>

    <div id="debug">Чанков: <span id="chunks">0</span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ============ ШУМ ПЕРЛИНА ============
        class SimplexNoise {
            constructor(seed = Math.random()) {
                this.p = new Uint8Array(512);
                const perm = new Uint8Array(256);
                for (let i = 0; i < 256; i++) perm[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor((seed * 1000 * (i + 1)) % (i + 1));
                    [perm[i], perm[j]] = [perm[j], perm[i]];
                }
                for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise3D(x, y, z) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = this.fade(x), v = this.fade(y), w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z;
                const B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z),
                    this.grad(this.p[BA], x - 1, y, z)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1),
                        this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                        this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }

        const noise = new SimplexNoise(42);

        // ============ НАСТРОЙКИ ============
        const CHUNK_SIZE = 16;
        const RENDER_DISTANCE = 4;
        const BLOCK_SIZE = 1;
        const GRAVITY = 0.015;
        const JUMP_FORCE = 0.25;
        const MOVE_SPEED = 0.15;
        const SPRINT_SPEED = 0.25;

        // Типы блоков
        const BLOCK_TYPES = {
            DIRT: { color: 0x8B4513, name: 'Земля' },
            GRASS: { color: 0x228B22, name: 'Трава' },
            STONE: { color: 0x808080, name: 'Камень' },
            WATER: { color: 0x1E90FF, name: 'Вода' },
            SAND: { color: 0xF4A460, name: 'Песок' }
        };

        // ============ СЦЕНА ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // ============ МИР (ЧАНКИ) ============
        const chunks = new Map();
        const chunkMeshes = new Map();
        const blockGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        // Материалы для каждого типа блока
        const blockMaterials = {};
        Object.keys(BLOCK_TYPES).forEach(key => {
            blockMaterials[key] = new THREE.MeshLambertMaterial({
                color: BLOCK_TYPES[key].color
            });
        });

        function getChunkKey(cx, cz) {
            return `${cx},${cz}`;
        }

        function getHeight(wx, wz) {
            const scale = 0.05;
            let h = 0;
            h += noise.noise3D(wx * scale, 0, wz * scale) * 10;
            h += noise.noise3D(wx * scale * 2, 0, wz * scale * 2) * 5;
            h += noise.noise3D(wx * scale * 4, 0, wz * scale * 4) * 2;
            return Math.floor(h);
        }

        function getBlockType(wx, wz, wy, height) {
            if (wy < height - 3) return 'STONE';
            if (wy < height) return 'DIRT';
            if (wy === height) {
                if (height < -2) return 'WATER';
                if (height < 0) return 'SAND';
                return 'GRASS';
            }
            return null;
        }

        function generateChunk(cx, cz) {
            const key = getChunkKey(cx, cz);
            if (chunks.has(key)) return;

            const chunk = {};
            const startX = cx * CHUNK_SIZE;
            const startZ = cz * CHUNK_SIZE;

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wx = startX + x;
                    const wz = startZ + z;
                    const height = getHeight(wx, wz);

                    for (let y = height - 5; y <= height + 1; y++) {
                        const blockType = getBlockType(wx, wz, y, height);
                        if (blockType) {
                            chunk[`${wx},${y},${wz}`] = blockType;
                        }
                    }
                }
            }

            chunks.set(key, chunk);
            buildChunkMesh(cx, cz, chunk);
        }

        function buildChunkMesh(cx, cz, chunk) {
            const key = getChunkKey(cx, cz);
            if (chunkMeshes.has(key)) {
                chunkMeshes.get(key).forEach(mesh => scene.remove(mesh));
            }

            const meshes = [];
            const instances = {};

            Object.keys(BLOCK_TYPES).forEach(type => {
                instances[type] = [];
            });

            Object.entries(chunk).forEach(([blockKey, blockType]) => {
                const [wx, wy, wz] = blockKey.split(',').map(Number);
                instances[blockType].push({ x: wx, y: wy, z: wz });
            });

            Object.entries(instances).forEach(([type, blocks]) => {
                if (blocks.length === 0) return;

                const material = blockMaterials[type];
                const mesh = new THREE.InstancedMesh(blockGeometry, material, blocks.length);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                const dummy = new THREE.Object3D();
                blocks.forEach((block, i) => {
                    dummy.position.set(block.x, block.y, block.z);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });

                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);
                meshes.push(mesh);
            });

            chunkMeshes.set(key, meshes);
        }

        function updateChunks(playerX, playerZ) {
            const pcx = Math.floor(playerX / CHUNK_SIZE);
            const pcz = Math.floor(playerZ / CHUNK_SIZE);

            for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
                for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
                    const cx = pcx + dx;
                    const cz = pcz + dz;
                    generateChunk(cx, cz);
                }
            }

            // Удаляем дальние чанки
            chunkMeshes.forEach((meshes, key) => {
                const [cx, cz] = key.split(',').map(Number);
                const dist = Math.max(Math.abs(cx - pcx), Math.abs(cz - pcz));
                if (dist > RENDER_DISTANCE + 1) {
                    meshes.forEach(mesh => scene.remove(mesh));
                    chunkMeshes.delete(key);
                    chunks.delete(key);
                }
            });

            document.getElementById('chunks').innerText = chunkMeshes.size;
        }

        // ============ ИГРОК ============
        const player = {
            position: new THREE.Vector3(0, 20, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: false,
            height: 1.8,
            width: 0.6,
            rotation: new THREE.Euler(0, 0, 0, 'YXZ')
        };

        camera.position.copy(player.position);
        camera.position.y += player.height;

        // ============ УПРАВЛЕНИЕ ============
        const keys = {};
        let isPointerLocked = false;
        let selectedSlot = 0;
        let gameMode = 'walk'; // 'walk' или 'fly'

        document.getElementById('instructions').addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
            document.getElementById('instructions').style.display = isPointerLocked ? 'none' : 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            player.rotation.y -= e.movementX * 0.002;
            player.rotation.x -= e.movementY * 0.002;
            player.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotation.x));
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            // Выбор слота
            if (e.code >= 'Digit1' && e.code <= 'Digit5') {
                selectedSlot = parseInt(e.code.charAt(5)) - 1;
                document.querySelectorAll('.hotbar-slot').forEach((slot, i) => {
                    slot.classList.toggle('active', i === selectedSlot);
                });
            }

            // Переключение режима
            if (e.code === 'KeyF') {
                gameMode = gameMode === 'walk' ? 'fly' : 'walk';
                document.getElementById('mode').innerText = gameMode === 'walk' ? 'ХОДЬБА' : 'ПОЛЁТ';
                player.velocity.set(0, 0, 0);
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Raycaster для ломания/установки блоков
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6;

        document.addEventListener('mousedown', (e) => {
            if (!isPointerLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Собираем все меши чанков
            const allMeshes = [];
            chunkMeshes.forEach(meshes => allMeshes.push(...meshes));

            const intersects = raycaster.intersectObjects(allMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const blockPos = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(e.button === 2 ? 0.5 : -0.5));
                const bx = Math.round(blockPos.x);
                const by = Math.round(blockPos.y);
                const bz = Math.round(blockPos.z);

                const cx = Math.floor(bx / CHUNK_SIZE);
                const cz = Math.floor(bz / CHUNK_SIZE);
                const key = getChunkKey(cx, cz);
                const chunk = chunks.get(key);

                if (e.button === 0) {
                    // Ломать блок
                    if (chunk) {
                        delete chunk[`${bx},${by},${bz}`];
                        buildChunkMesh(cx, cz, chunk);
                    }
                } else if (e.button === 2) {
                    // Ставить блок
                    if (chunk) {
                        const blockTypes = Object.keys(BLOCK_TYPES);
                        chunk[`${bx},${by},${bz}`] = blockTypes[selectedSlot];
                        buildChunkMesh(cx, cz, chunk);
                    }
                }
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============ ФИЗИКА ============
        function getBlockAt(x, y, z) {
            const cx = Math.floor(x / CHUNK_SIZE);
            const cz = Math.floor(z / CHUNK_SIZE);
            const key = getChunkKey(cx, cz);
            const chunk = chunks.get(key);
            if (!chunk) return null;
            return chunk[`${Math.round(x)},${Math.round(y)},${Math.round(z)}`];
        }

        function checkCollision(pos) {
            const x = Math.round(pos.x);
            const y = Math.round(pos.y);
            const z = Math.round(pos.z);
            return getBlockAt(x, y, z) !== null;
        }

        function updatePlayer(dt) {
            const speed = keys['ShiftLeft'] ? SPRINT_SPEED : MOVE_SPEED;

            if (gameMode === 'walk') {
                // Движение
                const forward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, player.rotation.y, 0));
                const right = new THREE.Vector3(1, 0, 0).applyEuler(new THREE.Euler(0, player.rotation.y, 0));

                const moveDir = new THREE.Vector3(0, 0, 0);
                if (keys['KeyW']) moveDir.add(forward);
                if (keys['KeyS']) moveDir.sub(forward);
                if (keys['KeyD']) moveDir.add(right);
                if (keys['KeyA']) moveDir.sub(right);

                if (moveDir.length() > 0) {
                    moveDir.normalize().multiplyScalar(speed);
                    player.velocity.x = moveDir.x;
                    player.velocity.z = moveDir.z;
                } else {
                    player.velocity.x *= 0.8;
                    player.velocity.z *= 0.8;
                }

                // Прыжок
                if (keys['Space'] && player.onGround) {
                    player.velocity.y = JUMP_FORCE;
                    player.onGround = false;
                }

                // Гравитация
                player.velocity.y -= GRAVITY;

                // Применение скорости с проверкой коллизий
                const newPos = player.position.clone();

                // X
                newPos.x += player.velocity.x;
                if (checkCollision(new THREE.Vector3(newPos.x, player.position.y, player.position.z))) {
                    newPos.x = player.position.x;
                    player.velocity.x = 0;
                }

                // Z
                newPos.z += player.velocity.z;
                if (checkCollision(new THREE.Vector3(newPos.x, player.position.y, newPos.z))) {
                    newPos.z = player.position.z;
                    player.velocity.z = 0;
                }

                // Y
                newPos.y += player.velocity.y;
                if (checkCollision(new THREE.Vector3(newPos.x, newPos.y, newPos.z))) {
                    if (player.velocity.y < 0) player.onGround = true;
                    newPos.y = player.position.y;
                    player.velocity.y = 0;
                } else {
                    player.onGround = false;
                }

                player.position.copy(newPos);

            } else {
                // Режим полёта
                const forward = new THREE.Vector3(0, 0, -1).applyEuler(player.rotation);
                const right = new THREE.Vector3(1, 0, 0).applyEuler(player.rotation);
                const up = new THREE.Vector3(0, 1, 0);

                const moveDir = new THREE.Vector3(0, 0, 0);
                if (keys['KeyW']) moveDir.add(forward);
                if (keys['KeyS']) moveDir.sub(forward);
                if (keys['KeyD']) moveDir.add(right);
                if (keys['KeyA']) moveDir.sub(right);
                if (keys['Space']) moveDir.add(up);
                if (keys['ShiftLeft']) moveDir.sub(up);

                if (moveDir.length() > 0) {
                    moveDir.normalize().multiplyScalar(speed * 2);
                    player.position.add(moveDir);
                }
            }

            // Обновление камеры
            camera.position.copy(player.position);
            camera.position.y += player.height;
            camera.rotation.copy(player.rotation);
        }

        // ============ ЦИКЛ ============
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            // FPS
            frameCount++;
            fpsTime += dt;
            if (fpsTime >= 1) {
                document.getElementById('fps').innerText = frameCount;
                frameCount = 0;
                fpsTime = 0;
            }

            updatePlayer(dt);
            updateChunks(player.position.x, player.position.z);

            // UI
            document.getElementById('position').innerText =
                `${Math.floor(player.position.x)}, ${Math.floor(player.position.y)}, ${Math.floor(player.position.z)}`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
