<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetherbound - Voxel Worlds</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            cursor: none;
            font-family: monospace;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffcc;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 5px;
        }

        #planet-info {
            position: absolute;
            top: 15px;
            right: 15px;
            color: yellow;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }

        #weather-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div> СКОРОСТЬ: <span id="speed">0</span> км/с</div>
        <div>📡 РАССТОЯНИЕ: <span id="altitude">0</span> км</div>
        <div>️ ТЕМПЕРАТУРА: <span id="temp">20</span>°C</div>
    </div>
    <div id="planet-info">
        <b>ПЛАНЕТА:</b> <span id="planet-name">Земля</span><br>
        <div>🌦️ ПОГОДА: <span id="weather">Ясно</span></div>
        <div>📦 Вокселей: <span id="voxel-count">0</span></div>
    </div>
    <div id="controls">
        <b>УПРАВЛЕНИЕ:</b> W (газ), A/D (крен), Мышь (поворот)<br>
        Летайте между 4 планетами!
    </div>
    <canvas id="weather-overlay"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        console.log('=== ЗАПУСК ИГРЫ ===');

        // ШУМ ПЕРЛИНА
        class SimplexNoise {
            constructor() {
                this.p = new Uint8Array(512);
                const perm = new Uint8Array(256);
                for (let i = 0; i < 256; i++) perm[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [perm[i], perm[j]] = [perm[j], perm[i]];
                }
                for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise3D(x, y, z) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = this.fade(x), v = this.fade(y), w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z;
                const B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                        this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }

        const simplex = new SimplexNoise();

        // ТИПЫ ПЛАНЕТ
        const planetTypes = {
            earth: {
                name: 'Земля',
                weather: ['Ясно', 'Дождь', 'Облачно'],
                temp: 20,
                colors: {
                    water: 0x1a3d6e,
                    sand: 0xd4c08a,
                    grass: 0x3d8e3d,
                    forest: 0x2d5a2d,
                    stone: 0x666666,
                    snow: 0xffffff
                }
            },
            desert: {
                name: 'Пустыня',
                weather: ['Ясно', 'Песчаная буря', 'Жара'],
                temp: 45,
                colors: {
                    sand: 0xd4a574,
                    darkSand: 0xb8864a,
                    rock: 0x8B7355,
                    cactus: 0x2d5a2d
                }
            },
            ice: {
                name: 'Ледяная',
                weather: ['Снег', 'Метель', 'Ясно'],
                temp: -30,
                colors: {
                    ice: 0x88ccff,
                    snow: 0xffffff,
                    darkIce: 0x4488aa,
                    rock: 0x556677
                }
            },
            lava: {
                name: 'Вулканическая',
                weather: ['Пепел', 'Извержение', 'Ясно'],
                temp: 200,
                colors: {
                    lava: 0xff4400,
                    hotLava: 0xffaa00,
                    rock: 0x222222,
                    ash: 0x333333
                }
            }
        };

        // СЦЕНА
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 200, 1500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // СВЕТ
        scene.add(new THREE.AmbientLight(0x404040, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(200, 200, 200);
        scene.add(sun);

        // ФУНКЦИЯ СОЗДАНИЯ ВОКСЕЛЬНОЙ ПЛАНЕТЫ С INSTANCEDMESH
        function createVoxelPlanet(type, radius, position) {
            const planetGroup = new THREE.Group();
            const blockSize = 3;
            const info = planetTypes[type];
            const colors = info.colors;
            const colorKeys = Object.keys(colors);

            // Создаём InstancedMesh для каждого цвета
            const meshes = {};
            const maxInstances = 1500; // Максимум вокселей одного цвета

            colorKeys.forEach(key => {
                const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
                const material = new THREE.MeshPhongMaterial({
                    color: colors[key],
                    flatShading: true,
                    shininess: 10
                });
                const mesh = new THREE.InstancedMesh(geometry, material, maxInstances);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.count = 0; // Пока нет инстансов
                meshes[key] = { mesh, count: 0 };
                planetGroup.add(mesh);
            });

            // Генерация вокселей по сфере
            const totalVoxels = 3000;
            const dummy = new THREE.Object3D();

            for (let i = 0; i < totalVoxels; i++) {
                // Равномерное распределение по сфере (алгоритм Фибоначчи)
                const phi = Math.acos(1 - 2 * (i + 0.5) / totalVoxels);
                const theta = Math.PI * (1 + Math.sqrt(5)) * i;

                const x = Math.sin(phi) * Math.cos(theta);
                const y = Math.sin(phi) * Math.sin(theta);
                const z = Math.cos(phi);

                // Шум для рельефа
                const noise1 = simplex.noise3D(x * 2, y * 2, z * 2);
                const noise2 = simplex.noise3D(x * 4, y * 4, z * 4) * 0.5;
                const noise3 = simplex.noise3D(x * 8, y * 8, z * 8) * 0.25;
                const totalNoise = noise1 + noise2 + noise3;

                const surfaceRadius = radius + totalNoise * 8;

                const finalX = x * surfaceRadius;
                const finalY = y * surfaceRadius;
                const finalZ = z * surfaceRadius;

                // Выбор цвета по высоте
                let colorKey;
                const heightRatio = (surfaceRadius - radius) / 8;

                if (type === 'earth') {
                    if (heightRatio < -0.3) colorKey = 'water';
                    else if (heightRatio < -0.1) colorKey = 'sand';
                    else if (heightRatio < 0.3) colorKey = 'grass';
                    else if (heightRatio < 0.6) colorKey = 'forest';
                    else if (heightRatio < 0.8) colorKey = 'stone';
                    else colorKey = 'snow';
                } else if (type === 'desert') {
                    if (heightRatio < 0) colorKey = 'darkSand';
                    else if (heightRatio < 0.5) colorKey = 'sand';
                    else if (heightRatio < 0.8) colorKey = 'rock';
                    else colorKey = 'cactus';
                } else if (type === 'ice') {
                    if (heightRatio < -0.2) colorKey = 'darkIce';
                    else if (heightRatio < 0.3) colorKey = 'ice';
                    else if (heightRatio < 0.7) colorKey = 'snow';
                    else colorKey = 'rock';
                } else if (type === 'lava') {
                    if (heightRatio < -0.3) colorKey = 'rock';
                    else if (heightRatio < 0.2) colorKey = 'ash';
                    else if (heightRatio < 0.6) colorKey = 'lava';
                    else colorKey = 'hotLava';
                }

                if (!colorKey) colorKey = colorKeys[0];

                // Устанавливаем матрицу инстанса
                dummy.position.set(finalX, finalY, finalZ);
                dummy.lookAt(0, 0, 0);
                dummy.updateMatrix();

                const meshData = meshes[colorKey];
                if (meshData.count < maxInstances) {
                    meshData.mesh.setMatrixAt(meshData.count, dummy.matrix);
                    meshData.count++;
                }
            }

            // Обновляем счётчики
            colorKeys.forEach(key => {
                meshes[key].mesh.count = meshes[key].count;
                meshes[key].mesh.instanceMatrix.needsUpdate = true;
            });

            planetGroup.position.set(...position);
            scene.add(planetGroup);

            const totalVoxelCount = colorKeys.reduce((sum, key) => sum + meshes[key].count, 0);

            return {
                mesh: planetGroup,
                type: info,
                position: new THREE.Vector3(...position),
                radius: radius,
                voxelCount: totalVoxelCount
            };
        }

        // СОЗДАЁМ 4 ПЛАНЕТЫ
        const planets = [];
        planets.push(createVoxelPlanet('earth', 50, [0, 0, 0]));
        planets.push(createVoxelPlanet('desert', 45, [250, 50, 0]));
        planets.push(createVoxelPlanet('ice', 48, [-250, 30, 150]));
        planets.push(createVoxelPlanet('lava', 40, [0, -200, 250]));

        const totalVoxels = planets.reduce((sum, p) => sum + p.voxelCount, 0);
        document.getElementById('voxel-count').innerText = totalVoxels;
        console.log('Планеты созданы. Всего вокселей:', totalVoxels);

        // ЗВЁЗДЫ
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(5000 * 3);
        for (let i = 0; i < 5000 * 3; i++) starsPos[i] = (Math.random() - 0.5) * 4000;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2 })));

        // КОРАБЛЬ
        const ship = new THREE.Group();
        scene.add(ship);

        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1.5, 12, 8),
            new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 50 })
        );
        body.rotation.x = Math.PI / 2;
        ship.add(body);

        const nose = new THREE.Mesh(
            new THREE.ConeGeometry(1, 6, 8),
            new THREE.MeshPhongMaterial({ color: 0xff2222, shininess: 50 })
        );
        nose.rotation.x = Math.PI / 2;
        nose.position.z = -9;
        ship.add(nose);

        const wings = new THREE.Mesh(
            new THREE.BoxGeometry(14, 0.3, 4),
            new THREE.MeshPhongMaterial({ color: 0x999999 })
        );
        wings.position.z = 2;
        ship.add(wings);

        const flame1 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6, 3, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        flame1.rotation.x = -Math.PI / 2;
        flame1.position.set(-2.5, 0, 7.5);
        flame1.visible = false;
        ship.add(flame1);

        const flame2 = new THREE.Mesh(
            new THREE.ConeGeometry(0.6, 3, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        flame2.rotation.x = -Math.PI / 2;
        flame2.position.set(2.5, 0, 7.5);
        flame2.visible = false;
        ship.add(flame2);

        ship.position.set(0, 120, 0);

        // КАМЕРА
        camera.position.set(0, 5, 20);
        ship.add(camera);

        // СИСТЕМА ПОГОДЫ (Canvas overlay)
        const weatherCanvas = document.getElementById('weather-overlay');
        const weatherCtx = weatherCanvas.getContext('2d');
        weatherCanvas.width = window.innerWidth;
        weatherCanvas.height = window.innerHeight;

        let weatherParticles = [];
        let currentWeather = 'Ясно';

        function setWeather(type) {
            currentWeather = type;
            weatherParticles = [];
            const count = type === 'Ясно' ? 0 : 500;

            for (let i = 0; i < count; i++) {
                weatherParticles.push({
                    x: Math.random() * weatherCanvas.width,
                    y: Math.random() * weatherCanvas.height,
                    speed: type === 'Дождь' ? 15 : type === 'Снег' ? 3 : type === 'Метель' ? 8 : 5,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function updateWeather() {
            weatherCtx.clearRect(0, 0, weatherCanvas.width, weatherCanvas.height);

            if (currentWeather === 'Ясно') return;

            let color;
            if (currentWeather === 'Дождь') color = 'rgba(100, 150, 255, 0.5)';
            else if (currentWeather === 'Снег' || currentWeather === 'Метель') color = 'rgba(255, 255, 255, 0.7)';
            else if (currentWeather === 'Песчаная буря') color = 'rgba(210, 180, 140, 0.3)';
            else if (currentWeather === 'Пепел') color = 'rgba(80, 80, 80, 0.5)';
            else if (currentWeather === 'Облачно') color = 'rgba(200, 200, 200, 0.1)';
            else if (currentWeather === 'Жара') color = 'rgba(255, 200, 100, 0.15)';
            else if (currentWeather === 'Извержение') color = 'rgba(255, 100, 0, 0.2)';

            weatherCtx.fillStyle = color;

            weatherParticles.forEach(p => {
                p.y += p.speed;
                p.x += (Math.random() - 0.5) * 2;

                if (p.y > weatherCanvas.height) {
                    p.y = -10;
                    p.x = Math.random() * weatherCanvas.width;
                }

                weatherCtx.beginPath();
                weatherCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                weatherCtx.fill();
            });
        }

        // УПРАВЛЕНИЕ
        let speed = 0;
        const keys = {};
        let weatherTimer = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        let mouseDown = false;
        window.addEventListener('mousedown', () => mouseDown = true);
        window.addEventListener('mouseup', () => mouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (mouseDown) {
                ship.rotation.y -= e.movementX * 0.005;
                ship.rotation.x -= e.movementY * 0.005;
                ship.rotation.x = Math.max(-1.2, Math.min(1.2, ship.rotation.x));
            }
        });

        console.log('=== ИГРА ГОТОВА ===');

        // ЦИКЛ
        function animate() {
            requestAnimationFrame(animate);

            // Движение
            if (keys['KeyW'] || keys['ArrowUp']) {
                speed = Math.min(speed + 0.15, 5);
            } else {
                speed *= 0.95;
            }

            ship.translateZ(-speed);

            // Крен
            if (keys['KeyA'] || keys['ArrowLeft']) {
                ship.rotation.z += (0.5 - ship.rotation.z) * 0.1;
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                ship.rotation.z += (-0.5 - ship.rotation.z) * 0.1;
            } else {
                ship.rotation.z += (0 - ship.rotation.z) * 0.1;
            }

            // Двигатели
            if (speed > 0.3) {
                flame1.visible = true;
                flame2.visible = true;
                flame1.scale.setScalar(0.8 + Math.random() * 0.4);
                flame2.scale.setScalar(0.8 + Math.random() * 0.4);
            } else {
                flame1.visible = false;
                flame2.visible = false;
            }

            // Определение ближайшей планеты
            let minDist = Infinity;
            let currentPlanet = planets[0];

            planets.forEach(planet => {
                const dist = ship.position.distanceTo(planet.position);
                if (dist < minDist) {
                    minDist = dist;
                    currentPlanet = planet;
                }
                planet.mesh.rotation.y += 0.0005;
            });

            // Смена погоды
            weatherTimer++;
            if (weatherTimer > 400) {
                weatherTimer = 0;
                const weatherIndex = Math.floor(Math.random() * currentPlanet.type.weather.length);
                const newWeather = currentPlanet.type.weather[weatherIndex];
                if (newWeather !== currentWeather) {
                    setWeather(newWeather);
                    document.getElementById('weather').innerText = newWeather;
                }
            }

            updateWeather();

            // UI
            document.getElementById('speed').innerText = (speed * 100).toFixed(0);
            document.getElementById('altitude').innerText = minDist.toFixed(0);
            document.getElementById('planet-name').innerText = currentPlanet.type.name;
            document.getElementById('temp').innerText = currentPlanet.type.temp;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            weatherCanvas.width = window.innerWidth;
            weatherCanvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
